<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>A workout on Cadenza</title>
<meta property="og:title" content="A workout on Cadenza">
<meta property="og:description" content="Open this link in Cadenza to see the workout and save it.">
<meta property="og:site_name" content="Cadenza">
<meta property="og:type" content="website">
<meta property="og:url" content="https://giorgia.github.io/w">
<meta property="og:image" content="https://giorgia.github.io/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Cadenza app icon">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/apple-touch-icon.png">
<script>
  // The Smart App Banner hands the full link to the app. The workout stays in
  // the fragment, so it is written into the tag here and never reaches a server.
  (function () {
    var appID = "6794137157";
    var content = "app-id=" + appID;
    if (location.hash.length > 1) {
      content += ", app-argument=" + location.origin + location.pathname + location.hash;
    }
    document.write('<meta name="apple-itunes-app" content="' + content.replace(/"/g, "") + '">');
  })();
</script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 24px 16px;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at top, #101319, #0a0b0d 70%);
    color: #fff; text-align: center;
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  }
  main { max-width: 340px; }
  h1 { margin: 0 0 12px; font-size: 28px; line-height: 1.15; letter-spacing: -0.02em; }
  p { margin: 0 0 16px; color: rgba(255, 255, 255, 0.72); }
  a.get {
    display: block; margin: 24px 0 16px; padding: 15px 20px; border-radius: 14px;
    background: #fff; color: #0a0b0d; font-weight: 600; text-decoration: none;
  }
  small { color: rgba(255, 255, 255, 0.55); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>You've got a workout</h1>
  <p>Get Cadenza to open it. Already have the app? Update to the latest version.</p>
  <a class="get" id="get" href="https://apps.apple.com/app/id6794137157">Get Cadenza</a>
  <small>After installing, go back to your message and tap the link again.</small>
</main>
<script>
  // Goes to the App Store once per tab, so coming back here to reread the
  // message doesn't bounce the reader away again.
  (function () {
    var key = "cadenza.sentToStore", seen = false;
    try { seen = sessionStorage.getItem(key) === "1"; } catch (e) {}
    if (seen) return;
    try { sessionStorage.setItem(key, "1"); } catch (e) {}
    setTimeout(function () { location.href = document.getElementById("get").href; }, 2000);
  })();
</script>
</body>
</html>
